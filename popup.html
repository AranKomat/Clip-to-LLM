<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip-to-LLM</title>
  <style>
    body {
      width: 400px;
      min-height: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .queue-count {
      background: #e3f2fd;
      color: #1976d2;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1565c0;
    }

    button.secondary {
      background: #757575;
    }

    button.secondary:hover {
      background: #616161;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .queue-list {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .queue-item {
      padding: 12px;
      margin-bottom: 8px;
      background: #f5f5f5;
      border-radius: 6px;
      border-left: 3px solid #1976d2;
    }

    .queue-item-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 4px;
    }

    .queue-item-type {
      font-weight: 600;
      color: #1976d2;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .queue-item-remove {
      background: none;
      border: none;
      color: #d32f2f;
      cursor: pointer;
      padding: 0;
      font-size: 18px;
      line-height: 1;
      width: auto;
    }

    .queue-item-title {
      font-weight: 500;
      margin-bottom: 4px;
      color: #1a1a1a;
    }

    .queue-item-url {
      font-size: 11px;
      color: #666;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .queue-item-preview {
      font-size: 12px;
      color: #555;
      margin-top: 8px;
      max-height: 60px;
      overflow: hidden;
      line-height: 1.4;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .shortcuts {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
    }

    .shortcuts-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
    }

    .shortcut {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 12px;
    }

    .shortcut-key {
      font-family: monospace;
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
    }

    .footer a {
      color: #1976d2;
      text-decoration: none;
      font-size: 12px;
    }

    .screenshot-indicator {
      display: inline-block;
      width: 40px;
      height: 40px;
      background-size: cover;
      background-position: center;
      border-radius: 4px;
      margin-top: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Clip-to-LLM</h1>
    <div class="queue-count" id="queueCount">0 items</div>
  </div>

  <div class="actions">
    <button id="clearQueue" class="secondary">Clear Queue</button>
    <button id="openSettings" class="secondary">Settings</button>
  </div>

  <div class="queue-list" id="queueList">
    <div class="empty-state">
      <div class="empty-state-icon">📋</div>
      <div>Queue is empty</div>
      <div style="font-size: 12px; margin-top: 8px;">Use Ctrl+Shift+C to save content</div>
    </div>
  </div>

  <div class="shortcuts">
    <div class="shortcuts-title">Keyboard Shortcuts</div>
    <div class="shortcut">
      <span>Save Smart</span>
      <span class="shortcut-key">Ctrl+Shift+C</span>
    </div>
    <div class="shortcut">
      <span>Quick Send</span>
      <span class="shortcut-key">Ctrl+Shift+V</span>
    </div>
    <div class="shortcut">
      <span>Summary</span>
      <span class="shortcut-key">Ctrl+Shift+S</span>
    </div>
    <div class="shortcut">
      <span>Screenshot</span>
      <span class="shortcut-key">Ctrl+Shift+D</span>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="viewAllShortcuts">View all shortcuts</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
