<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip-to-LLM Settings</title>
  <style>
    body {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
      background: #f8f9fa;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .subtitle {
      color: #666;
      margin-bottom: 32px;
    }

    .section {
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid #e0e0e0;
    }

    .section:last-child {
      border-bottom: none;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a1a1a;
    }

    .setting {
      margin-bottom: 20px;
    }

    .setting-label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .setting-description {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: monospace;
    }

    input[type="checkbox"] {
      margin-right: 8px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 8px 0;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    button {
      padding: 10px 24px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1565c0;
    }

    button.secondary {
      background: #757575;
    }

    button.secondary:hover {
      background: #616161;
    }

    .save-status {
      display: inline-block;
      margin-left: 12px;
      color: #2e7d32;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .save-status.show {
      opacity: 1;
    }

    .site-override-list {
      margin-top: 12px;
    }

    .site-override-item {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .site-override-item input {
      flex: 1;
    }

    .site-override-item select {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .site-override-item button {
      padding: 8px 12px;
      background: #d32f2f;
    }

    .site-override-item button:hover {
      background: #c62828;
    }

    .add-override-btn {
      margin-top: 8px;
      padding: 8px 16px;
      font-size: 13px;
    }

    .info-box {
      background: #e3f2fd;
      border-left: 4px solid #1976d2;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Settings</h1>
    <div class="subtitle">Configure Clip-to-LLM behavior</div>

    <div class="section">
      <div class="section-title">General</div>

      <div class="setting">
        <label class="checkbox-label">
          <input type="checkbox" id="clearQueueAfterSend">
          <span>Clear queue after sending to ChatGPT</span>
        </label>
      </div>

      <div class="setting">
        <label class="checkbox-label">
          <input type="checkbox" id="sendAfterPaste">
          <span>Auto-send after pasting image (Ctrl/Cmd+V)</span>
        </label>
        <div class="setting-description">Automatically press Enter after detecting image paste</div>
      </div>

      <div class="setting">
        <label class="setting-label">Max queue items</label>
        <input type="number" id="maxQueueItems" min="5" max="100" value="25">
      </div>

      <div class="setting">
        <label class="setting-label">Max total image size (MB)</label>
        <input type="number" id="maxImageSize" min="5" max="100" value="25">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Custom Prompts</div>

      <div class="info-box">
        These prompts are prepended to your content when using Custom Quick Send shortcuts.
      </div>

      <div class="setting">
        <label class="setting-label">Custom Send 1 (Ctrl+Shift+X)</label>
        <textarea id="custom1Prompt" placeholder="Explain:&#10;"></textarea>
      </div>

      <div class="setting">
        <label class="setting-label">Custom Send 2 (Ctrl+Shift+Z)</label>
        <textarea id="custom2Prompt" placeholder="Translate:&#10;"></textarea>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Site Overrides</div>

      <div class="info-box">
        Override the default capture behavior for specific websites.
      </div>

      <div class="site-override-list" id="siteOverrideList">
        <!-- Dynamically populated -->
      </div>

      <button class="add-override-btn secondary" id="addOverride">+ Add Site Override</button>
    </div>

    <div class="button-group">
      <button id="saveSettings">Save Settings</button>
      <button class="secondary" id="resetSettings">Reset to Defaults</button>
      <span class="save-status" id="saveStatus">✓ Saved</span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
